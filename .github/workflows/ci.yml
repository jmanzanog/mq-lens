name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Embed frontend build
        run: |
          rm -rf internal/ui/dist
          mkdir -p internal/ui/dist
          cp -R web/dist/. internal/ui/dist/

      - name: Test Go
        run: go test ./...

      - name: Vet Go
        run: go vet ./...

      - name: Build Go
        run: go build -buildvcs=false -o /tmp/mq-lens ./cmd/mq-lens
