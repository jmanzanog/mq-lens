name: Publish Docker Image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-main
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER}"
          repo="${GITHUB_REPOSITORY#*/}"
          owner_lc="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          repo_lc="$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_lc}/${repo_lc}"
          date_tag="$(date -u +'%Y.%m.%d')"

          owner_type="$(gh api "/users/${owner}" --jq '.type')"
          if [ "$owner_type" = "Organization" ]; then
            package_endpoint="/orgs/${owner}/packages/container/${repo_lc}/versions"
          else
            package_endpoint="/users/${owner}/packages/container/${repo_lc}/versions"
          fi

          existing_tags="$(
            gh api --paginate "${package_endpoint}?per_page=100" --jq '.[].metadata.container.tags[]?' 2>/dev/null || true
          )"
          next="$(
            printf '%s\n' "$existing_tags" |
              awk -F. -v prefix="$date_tag" '
                $1 "." $2 "." $3 == prefix && $4 ~ /^[0-9]+$/ {
                  if ($4 + 0 > max) max = $4 + 0
                }
                END { print max + 1 }
              '
          )"

          tag="${date_tag}.${next}"
          short_sha="${SOURCE_SHA::12}"

          {
            echo "image=${image}"
            echo "version_tag=${tag}"
            echo "short_sha=${short_sha}"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing ${image}:${tag}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version_tag }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version_tag }}
